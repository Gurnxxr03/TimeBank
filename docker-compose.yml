services:
  mysql:
    image: mysql:8.0
    container_name: timebank_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: timebank_db
      MYSQL_USER: timebank_user
      MYSQL_PASSWORD: timebank_pass
    ports:
      - "3307:3306"
    volumes:
      - timebank_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "timebank_user", "-ptimebank_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timebank_mysql_data:
